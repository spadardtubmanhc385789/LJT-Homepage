name: Build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Inspect rendered content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          titles = ['SynLogic', 'Perception Bottleneck', 'Universal Truthfulness', 'In-Context Sharpness', 'C-Eval', 'Composing Parameter-Efficient']
          contact = ['jliugi@connect.ust.hk', 'Vicent0205', 'junteng88716710', 'scholar.google.com']
          for name in ['_site/index.html', '_site/publications/index.html', '_site/cv/index.html']:
              text = Path(name).read_text()
              print('FILE', name, 'chars', len(text))
              print('HEADINGS', re.findall(r'<h2[^>]*>(.{0,120}?)</h2>', text))
              print('PUBLICATIONS', {t: text.count(t) for t in titles})
              print('CONTACT', {t: text.count(t) for t in contact})
              print('SIDEBAR_AVATAR', 'author__avatar' in text)
              print('SAMPLE', text[max(0, text.find('<h2') - 120):text.find('<h2') + 400] if '<h2' in text else 'no h2 found')
          PY
