name: Build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Inspect rendered content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('_site/index.html').read_text()
          print('ABOUT HEADINGS', [re.sub(r'\s+', ' ', h) for h in re.findall(r'<h2[^>]*>(.*?)</h2>', text, re.S)])
          for phrase in ['Research Interests', 'Education', 'Research Experience', 'Publications', 'Skills', 'Honors', 'Contact Information']:
              position = text.find(phrase)
              print(phrase, 'FOUND' if position >= 0 else 'MISSING')
          publications = Path('_site/publications/index.html').read_text()
          print('VENUES', re.findall(r'Published in <i>(.*?)</i>, (\d{4})', publications))
          print('AUTHOR HIGHLIGHTING', publications.count('<strong>Junteng Liu</strong>'))
          print('BROKEN DEMO LINKS', [s for s in ['paper1.pdf', 'paper2.pdf', 'paper3.pdf', 'slides1.pdf', 'talkmap'] if s in publications])
          PY
