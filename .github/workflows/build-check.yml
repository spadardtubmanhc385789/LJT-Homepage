name: Build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Inspect rendered content
        run: |
          echo "Built index pages:"
          find _site -name 'index.html' | sort
          echo "About page section headings:"
          grep -o '<h2 id="[^"]*"' _site/index.html
          echo "About page personal details:"
          grep -o 'jliugi@connect.ust.hk\|Vicent0205\|junteng88716710\|MINIMAX\|Zhiyuan Honor Scholarship' _site/index.html | sort | uniq -c
          echo "Publication entries on publications page:"
          grep -c 'archive__item-title' _site/publications/index.html
          echo "Publication titles on publications page:"
          grep -o '<h2 class="archive__item-title"[^>]*>.\{0,180\}' _site/publications/index.html
          echo "Publication entries on CV page:"
          grep -c 'archive__item-title' _site/cv/index.html
          echo "Sidebar avatar element (should be empty):"
          grep -o 'author__avatar' _site/index.html || true
